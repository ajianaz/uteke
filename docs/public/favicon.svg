<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="#0C0A09"/>
  <!-- Connection lines (behind nodes) -->
  <g stroke="url(#amber)" stroke-width="3" opacity="0.4">
    <line x1="180" y1="160" x2="256" y2="256"/>
    <line x1="332" y1="160" x2="256" y2="256"/>
    <line x1="180" y1="352" x2="256" y2="256"/>
    <line x1="332" y1="352" x2="256" y2="256"/>
    <line x1="180" y1="160" x2="332" y2="160"/>
    <line x1="180" y1="352" x2="332" y2="352"/>
    <line x1="180" y1="160" x2="180" y2="352"/>
    <line x1="332" y1="160" x2="332" y2="352"/>
  </g>
  <!-- Nodes: neural network = memory graph -->
  <circle cx="180" cy="160" r="28" fill="url(#amber)"/>
  <circle cx="332" cy="160" r="28" fill="url(#amber)"/>
  <circle cx="256" cy="256" r="36" fill="url(#amber)"/>
  <circle cx="180" cy="352" r="28" fill="url(#amber)"/>
  <circle cx="332" cy="352" r="28" fill="url(#amber)"/>
</svg>
