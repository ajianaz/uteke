[package]
name = "uteke-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MCP server for uteke — expose persistent memory to AI coding agents"
readme = "README.md"
keywords = ["mcp", "ai", "memory", "embedding", "agents"]
categories = ["command-line-utilities", "development-tools"]
documentation = "https://docs.rs/uteke-mcp"
homepage = "https://github.com/codecoradev/uteke"

[[bin]]
name = "uteke-mcp"
path = "src/main.rs"

[lib]
name = "uteke_mcp"
path = "src/lib.rs"

[features]
default = ["usearch"]
# Vector index backend forwarded to uteke-core. Exactly one must be enabled;
# default is usearch (HNSW C++ FFI). vecq = pure-Rust 4-bit quantization (#1098).
usearch = ["uteke-core/usearch"]
vecq = ["uteke-core/vecq"]

[dependencies]
uteke-core = { path = "../uteke-core", version = "0.16.0", default-features = false, features = ["onnx"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
